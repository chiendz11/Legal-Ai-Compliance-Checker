name: legal-checker-local
services:
  postgres:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_USER: legal_checker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legal_checker_local_only}
      POSTGRES_DB: legal_checker_dev
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_checker -d legal_checker_dev"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
