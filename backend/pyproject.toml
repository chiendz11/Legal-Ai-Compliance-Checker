[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-ai-compliance-checker"
version = "0.1.0"
description = "BRD steps 5–7: criterion reasoning, risk and recommendations"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "openpyxl>=3.1,<4", "psycopg[binary]>=3.3,<4", "python-dotenv>=1,<2"]
postgres = ["psycopg[binary]>=3.3,<4"]
local-server = ["celerp-postgres==17.10.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["legal_checker*", "devtools*"]

[tool.setuptools.package-data]
"legal_checker.core" = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
